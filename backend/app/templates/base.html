<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="128x128" href="/assets/icons/icon-128.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="/assets/manifest.webmanifest">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-title" content="Trading">
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --text:#e6edf3; --dim:#8b949e;
          --ok:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap;
           padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  .tabs { display:inline-flex; gap:2px; flex-wrap:wrap; }
  .tabs a { color:var(--dim); padding:4px 10px; border-radius:6px; text-decoration:none; }
  .tabs a:hover { color:var(--text); }
  .tabs a.active { color:var(--text); background:#21262d; }
  .signout { margin-left:auto; }
  header strong { letter-spacing:.02em; }
  main { max-width:860px; margin:0 auto; padding:20px 16px 48px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px;
            padding:16px 18px; margin-bottom:16px; }
  h2 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.06em;
       color:var(--dim); font-weight:600; }
  p { margin:6px 0; }
  .dim { color:var(--dim); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:8px; }
  .ok { background:var(--ok); } .warn { background:var(--warn); } .bad { background:var(--bad); }
  .error { border-color:var(--bad); color:#ffb4ae; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { padding:7px 8px; text-align:right; border-bottom:1px solid var(--line);
           white-space:nowrap; }
  th { color:var(--dim); font-weight:500; font-size:13px; }
  th:first-child, td:first-child { text-align:left; }
  tr:last-child td { border-bottom:0; }
  .scroll { overflow-x:auto; }
  input[type=password], input[type=text] { width:100%; padding:9px 10px; border-radius:6px;
    border:1px solid var(--line); background:var(--bg); color:var(--text); font:inherit; }
  button, a.button { display:inline-block; padding:8px 14px; border-radius:6px; font:inherit;
    border:1px solid var(--line); background:#21262d; color:var(--text); cursor:pointer;
    text-decoration:none; }
  button.primary, a.button.primary { background:#1f6feb; border-color:#1f6feb; color:#fff; }
  button.link { border:0; background:none; color:var(--dim); padding:0; }
  ol { margin:8px 0; padding-left:20px; } li { margin:8px 0; }
  code { background:var(--bg); padding:1px 5px; border-radius:4px; font-size:13px;
         overflow-wrap:anywhere; }
  form.inline { display:inline; }
  textarea { width:100%; padding:9px 10px; border-radius:6px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); font:inherit; }
  input[type=number] { width:100%; padding:6px 8px; border-radius:6px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); font:inherit; text-align:right; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--line); border-radius:12px; padding:2px 4px 2px 10px; background:var(--bg); }
  .chip button { margin-left:4px; padding:0 6px; }
  .rule { display:flex; align-items:center; justify-content:space-between; gap:12px;
          padding:6px 0; border-bottom:1px solid var(--line); }
  .rule-input { display:inline-flex; align-items:center; gap:6px; flex:none; }
  .rule-input input { width:90px; }
  .rule-input .unit { width:28px; }
  section { scroll-margin-top: 12px; }
</style>
</head>
<body>
<header>
  <strong>Trading</strong>
  {% block header %}{% endblock %}
</header>
<main>{% block main %}{% endblock %}</main>
</body>
</html>
