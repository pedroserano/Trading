{% extends "base.html" %}
{% block main %}
<section style="max-width:380px; margin:48px auto;">
  <h2>Sign in</h2>
  {% if error %}<p style="color:var(--bad)">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <p><input type="password" name="password" placeholder="App password"
              autocomplete="current-password" autofocus required></p>
    <p><button class="primary" type="submit">Sign in</button></p>
  </form>
  <p class="dim">This is the app's own password, not your Schwab password.</p>
</section>
{% endblock %}
