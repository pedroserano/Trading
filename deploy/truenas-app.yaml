# Paste into TrueNAS: Apps > Discover Apps > Custom App menu > Install via YAML.
# Self-contained: the only other file needed on the NAS is /mnt/thor/trading/.env
# (copy deploy/.env.example). The app is served at https://<NAS address>:8443.
# Adjust the marked values: the NAS's LAN address (twice), and the dataset path if yours
# is not /mnt/thor/trading. That path must be a dataset on a data pool, not a folder on the
# boot drive (see docs/DEPLOY-TRUENAS.md, Option A).
# Optional, Tailscale: to reach the app at its Tailscale name with a trusted certificate, add
# that name to the site line, e.g. "https://192.168.7.80, https://nas.tailnet.ts.net {", and
# see docs/DEPLOY-TRUENAS.md, "Tailscale".
configs:
  caddyfile:
    content: |
      {
        auto_https disable_redirects
        default_sni 192.168.7.80
      }
      https://192.168.7.80 {
        tls internal
        encode zstd gzip
        reverse_proxy backend:8000
      }
networks:
  internal: {}
services:
  backend:
    container_name: trading-backend
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    env_file: /mnt/thor/trading/.env
    environment:
      TZ: America/New_York
    image: ghcr.io/pedroserano/trading-backend:main
    networks:
      - internal
    # Always fetch the newest build when the app starts; the tag never changes.
    pull_policy: always
    restart: unless-stopped
    volumes:
      - /mnt/thor/trading/config:/data
  caddy:
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    container_name: trading-caddy
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    image: caddy:2
    networks:
      - internal
    ports:
      - '8443:443'
    restart: unless-stopped
    volumes:
      - /mnt/thor/trading/caddy:/data
  postgres:
    container_name: trading-postgres
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    env_file: /mnt/thor/trading/.env
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      TZ: America/New_York
    healthcheck:
      interval: 10s
      retries: 6
      test:
        - CMD-SHELL
        - pg_isready -U trading -d trading
      timeout: 5s
    image: postgres:17
    networks:
      - internal
    restart: unless-stopped
    volumes:
      - /mnt/thor/trading/postgres:/var/lib/postgresql/data
